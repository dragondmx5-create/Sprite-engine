<script>
const { generateSprite, generateEnemy, generateItem, generateAnimation,
        CREATURE_KINDS, ITEM_KINDS } = SpriteEngine;

const $ = (id) => document.getElementById(id);
let SEED = 'undral';
let SIZE = 24;
let SS = 2;
let OUTLINE = true;

function opts(extra) {
  return Object.assign({ seed: SEED, size: SIZE, supersample: SS,
    outline: OUTLINE ? {} : false }, extra);
}

// Draw a SpriteBuffer onto a fresh canvas, nearest-neighbour upscaled.
function spriteCanvas(buf, scale) {
  const c = document.createElement('canvas');
  c.width = buf.width * scale; c.height = buf.height * scale;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const tmp = document.createElement('canvas');
  tmp.width = buf.width; tmp.height = buf.height;
  tmp.getContext('2d').putImageData(new ImageData(buf.data, buf.width, buf.height), 0, 0);
  ctx.drawImage(tmp, 0, 0, c.width, c.height);
  return c;
}

function tile(label, buf) {
  const wrap = document.createElement('div');
  wrap.className = 'tile';
  const scale = Math.max(2, Math.floor(96 / buf.width));
  wrap.appendChild(spriteCanvas(buf, scale));
  const cap = document.createElement('div');
  cap.className = 'cap'; cap.textContent = label;
  wrap.appendChild(cap);
  return wrap;
}

function section(title, tiles) {
  const sec = document.createElement('div'); sec.className = 'section';
  const h = document.createElement('h2'); h.textContent = title; sec.appendChild(h);
  const grid = document.createElement('div'); grid.className = 'grid';
  for (const t of tiles) grid.appendChild(t);
  sec.appendChild(grid);
  return sec;
}

function render() {
  const root = $('gallery');
  root.innerHTML = '';
  const t0 = performance.now();
  let count = 0;
  const add = (label, buf) => { count++; return tile(label, buf); };

  // Characters
  root.appendChild(section('کاراکترها — Characters', [
    add('villager', generateSprite(opts())),
    add('knight',   generateSprite(opts({ outfit: { armor: true } }))),
    add('rogue',    generateSprite(opts({ outfit: { torso: 'leather' } }))),
    add('cap',      generateSprite(opts({ outfit: { hat: 'cap' } }))),
    add('wizard',   generateSprite(opts({ outfit: { hat: 'hat' }, palette: { cloth: [80,150,110] } }))),
    add('redshirt', generateSprite(opts({ palette: { cloth: [200,70,70] } }))),
  ]));

  // Facing (top-down movement directions)
  root.appendChild(section('جهت‌ها — Facing (top-down)', [
    add('front', generateSprite(opts({ facing: 'front' }))),
    add('back',  generateSprite(opts({ facing: 'back' }))),
    add('left',  generateSprite(opts({ facing: 'left' }))),
    add('right', generateSprite(opts({ facing: 'right' }))),
  ]));

  // Enemies
  const en = [];
  for (const kind of CREATURE_KINDS) {
    en.push(add(kind, generateEnemy(opts({ kind }))));
    en.push(add(kind + ' (alert)', generateEnemy(opts({ kind, alerted: true }))));
  }
  root.appendChild(section('دشمن‌ها — Enemies', en));

  // Items
  const it = ITEM_KINDS.map((kind) => add(kind, generateItem(opts({ kind }))));
  root.appendChild(section('آیتم‌ها — Loot', it));

  const ms = (performance.now() - t0).toFixed(1);
  $('stat').textContent = count + ' sprites @ ' + SIZE + 'px · ' + ms + ' ms total';
}

// Controls
$('seed').addEventListener('input', (e) => { SEED = e.target.value || '0'; render(); });
$('size').addEventListener('input', (e) => { SIZE = +e.target.value; $('sizeval').textContent = SIZE + 'px'; render(); });
$('ss').addEventListener('change', (e) => { SS = +e.target.value; render(); });
$('outline').addEventListener('change', (e) => { OUTLINE = e.target.checked; render(); });
$('rand').addEventListener('click', () => { SEED = Math.random().toString(36).slice(2, 8); $('seed').value = SEED; render(); });

render();
</script>
