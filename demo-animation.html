<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Chibi Sprite Engine — Skeletal Animation Demo</title>
<style>
 :root{--bg:#16161d;--panel:#20212b;--ink:#e7e7ef;--muted:#9aa;--acc:#6ad0a8}
 *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
 header{padding:18px 22px;border-bottom:1px solid #2c2d3a}h1{margin:0;font-size:18px}header p{margin:4px 0 0;color:var(--muted)}
 .wrap{display:flex;gap:20px;padding:22px;flex-wrap:wrap}
 .panel{background:var(--panel);border:1px solid #2c2d3a;border-radius:12px;padding:16px}
 .controls{width:260px}label{display:block;margin:12px 0 4px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
 select,input[type=text]{width:100%;background:#15151c;border:1px solid #33344a;color:var(--ink);border-radius:8px;padding:8px}
 input[type=range]{width:100%}
 .seg{display:flex;gap:6px;margin-top:6px}.seg button{flex:1}
 button{background:#2a2b38;color:var(--ink);border:0;border-radius:8px;padding:9px 12px;font-weight:600;cursor:pointer}
 button.on{background:var(--acc);color:#06281d}
 .chk{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink)}
 canvas{image-rendering:pixelated}
 .stage{flex:1;min-width:340px;display:flex;flex-direction:column;gap:16px}
 .card{background:var(--panel);border:1px solid #2c2d3a;border-radius:12px;padding:16px}
 #play{background:radial-gradient(circle at 30% 30%,#33343f,#1a1b22);border-radius:12px}
 .stat{color:var(--muted);font-size:12px}.sheetwrap{overflow-x:auto}
</style></head><body>
<header><h1>Chibi Sprite Engine — Skeletal Animation</h1>
<p>Each frame = pose the existing skeleton, then run the SAME distance-field + lighting pass. Fixed seed + fixed light ⇒ no boiling.</p></header>
<div class="wrap">
 <div class="panel controls">
  <label>Animation</label>
  <div class="seg" id="anim"><button data-a="idle">idle</button><button data-a="walk" class="on">walk</button><button data-a="attack">attack</button></div>
  <label>Seed</label><input type="text" id="seed" value="walker"/>
  <label>Hat</label><select id="hat"><option>none</option><option>cap</option><option value="hat">wide-brim</option></select>
  <label>Torso</label><select id="torso"><option>cloth</option><option>leather</option></select>
  <div class="chk"><input type="checkbox" id="armor"/><span>Metal armor</span></div>
  <label>Light angle (fixed across frames)</label><input type="range" id="angle" min="0" max="360" value="235"/>
  <label>Playback speed ×<span id="spv">1.0</span></label><input type="range" id="speed" min="20" max="250" value="100"/>
  <div class="seg" style="margin-top:12px"><button id="pause">⏸ pause</button></div>
  <div class="stat" id="stat" style="margin-top:12px"></div>
 </div>
 <div class="stage">
  <div class="card"><div style="display:flex;gap:16px;align-items:center">
   <canvas id="play" width="320" height="320"></canvas>
   <div><div class="stat" id="frameinfo"></div></div>
  </div></div>
  <div class="card"><div class="stat" style="margin-bottom:8px">Spritesheet (horizontal, 1×) — what generateSpriteSheetCanvas() exports:</div>
   <div class="sheetwrap"><canvas id="sheet"></canvas></div></div>
 </div>
</div>
